<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المساعد الداخلي للموظفين</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
  body{background:#f3f4f6;height:100vh;display:flex;flex-direction:column}
  header{background:#111827;color:#fff;padding:14px 20px;font-weight:600}
  #gate{margin:auto;background:#fff;padding:30px;border-radius:16px;width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  #gate input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:14px 0;font-size:15px;text-align:center}
  button{background:#111827;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:14px}
  #chat{display:none;flex:1;flex-direction:column;max-width:800px;width:100%;margin:0 auto;overflow:hidden}
  #log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:80%;padding:11px 14px;border-radius:14px;line-height:1.75;white-space:pre-wrap;font-size:15px}
  .bot{background:#fff;align-self:flex-start}.me{background:#111827;color:#fff;align-self:flex-end}
  form{display:flex;gap:8px;padding:14px}
  form input{flex:1;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:15px}
  .err{color:#b91c1c;font-size:13px;min-height:18px}
</style>
</head>
<body>
<header id="title">المساعد الداخلي</header>
<div id="gate">
  <b>دخول الموظفين</b>
  <input id="code" type="password" placeholder="رمز الدخول">
  <div class="err" id="err"></div>
  <button id="enter">دخول</button>
</div>
<div id="chat">
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="اسأل عن سياسة، إجراء، معلومة..." autocomplete="off"><button>إرسال</button></form>
</div>
<script>
  const slug = new URLSearchParams(location.search).get('company') || 'demo';
  const uid = 'emp_' + Math.random().toString(36).slice(2);
  let code = '';
  const log = document.getElementById('log');
  const add = (t, w) => { const d = document.createElement('div'); d.className = 'm ' + w; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

  fetch('/api/company?slug=' + slug).then(r => r.json()).then(c => { if (c.name) document.getElementById('title').textContent = 'المساعد الداخلي — ' + c.name; });

  async function ask(text) {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company: slug, userKey: uid, text, mode: 'internal', code }) });
    return { ok: r.ok, data: await r.json() };
  }

  document.getElementById('enter').onclick = async () => {
    code = document.getElementById('code').value.trim();
    const { ok, data } = await ask('هلا');
    if (!ok) { document.getElementById('err').textContent = data.error || 'خطأ'; return; }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('chat').style.display = 'flex';
    add(data.reply, 'bot');
  };

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const q = document.getElementById('q'); const t = q.value.trim(); if (!t) return;
    add(t, 'me'); q.value = '';
    const w = add('...', 'bot');
    const { data } = await ask(t);
    w.textContent = data.reply || data.error;
  };
</script>
</body>
</html>
